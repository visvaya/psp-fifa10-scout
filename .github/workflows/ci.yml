name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: a corrected pull request title is checked again without a new push.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main get their own group (the run id)
# and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The full local gate. Git hooks only guard commits made on a machine that ran `pnpm install`;
  # this is the gate nothing can skip. The single required check.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # the live pull request title
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, text rules, typecheck, lint, tests with coverage, duplicates, dead code, build
        run: pnpm verify
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Audit all dependencies (report only)
        run: pnpm audit
        continue-on-error: true
      # The title becomes the commit on main when the pull request is squashed. Read live rather than
      # from the event, so a rerun after fixing the title sees the new one. Runs even after an earlier
      # failure, so a bad title is reported together with everything else.
      - name: Check the pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title | pnpm exec commitlint
