name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main get their own group (the run id)
# and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The full local gate. Git hooks only guard commits made on a machine that ran `pnpm install`;
  # this is the gate nothing can skip. The single required check.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, text rules, typecheck, lint, tests with coverage, duplicates, dead code, build, size
        run: pnpm verify
      # The build this job tested is the one the deploy job publishes (pushes to main only).
      - name: List the build's checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist-${{ github.sha }}
          path: |
            dist
            dist.sha256
          if-no-files-found: error
          retention-days: 7
          # A rerun of this job uploads the same name again.
          overwrite: true
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Audit all dependencies (report only)
        run: pnpm audit
        continue-on-error: true

  # Browser tests (Chromium and WebKit, axe included) against a synthetic fifa.db, plus the installable
  # app: offline start after one visit and the new-version prompt. A separate job because it takes a few
  # minutes; a required check.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # A run takes about 3 minutes; a stuck one fails within this rather than holding the PR.
    timeout-minutes: 12
    permissions:
      contents: read
    # Playwright's image holds the browsers and their system packages. Installing those packages on the
    # runner hung on a slow Ubuntu mirror until the job timed out (2026-11-04, four times). Its version
    # follows @playwright/test: scripts/check-playwright-image.ts fails verify when they part.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  # Publishes the build verify tested to Cloudflare Workers, after both gates, from main only. Off while the
  # repository has no CLOUDFLARE_ACCOUNT_ID variable (the job is then skipped); on, a missing or invalid
  # token fails the job. Installs only the pinned deployment tool (deploy/), never the app's dependencies.
  deploy:
    name: deploy
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://psp-fifa10-scout.visvaya.workers.dev/
    # One deploy at a time, in push order; a running deploy is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_URL: https://psp-fifa10-scout.visvaya.workers.dev/
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.sha }}
      - name: Check the build against its checksums
        run: |
          (cd dist && sha256sum --check --quiet ../dist.sha256)
          test "$(find dist -type f | wc -l)" -eq "$(wc -l < dist.sha256)"
      # A slower run of an older commit must not replace a newer release.
      - name: Skip unless this commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ -z "$head" ]; then echo "::error::could not read the head of main"; exit 1; fi
          if [ "$head" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::main is now at $head; its own run deploys it"; echo "current=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check the Cloudflare token
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::the CLOUDFLARE_API_TOKEN secret is missing or empty"; exit 1; fi
          # An account token verifies at the account endpoint, a user token at the user endpoint.
          verify() { curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1"; }
          account=$(verify "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")
          if [ "$account" = "200" ]; then exit 0; fi
          user=$(verify "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "$user" != "200" ]; then echo "::error::Cloudflare rejected the token (HTTP $account, $user)"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.head.outputs.current == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install the deployment tool
        if: steps.head.outputs.current == 'true'
        run: pnpm --dir deploy install --frozen-lockfile
      - name: Deploy
        if: steps.head.outputs.current == 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Check what the site serves
        if: steps.head.outputs.current == 'true'
        run: node scripts/check-deployment.ts "$SITE_URL" dist
