name: PR title

# The title becomes the commit on main when the pull request is squashed. A workflow of its own, so
# editing the title (or a bot editing the description) reruns only this check, not the whole gate.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the live pull request title
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Read live rather than from the event, so a rerun after fixing the title sees the new one.
      - name: Check the pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title | pnpm exec commitlint
