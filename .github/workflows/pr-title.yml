name: PR title

# The title becomes the commit on main when the pull request is squashed. A workflow of its own, so
# editing the title (or a bot editing the description) reruns only this check, not the whole gate.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependabot titles ("bump X from A to B in /dir in the <group> group across 1 directory") often pass
  # the 72-character limit, and Dependabot has no setting for their form. This job shortens such a
  # title before the check below reads it. It uses no action and no repository code: a Dependabot
  # pull request can update the actions themselves, and the workflow runs from the pull request, so
  # an action here would run its new, unreviewed version with the write token. An edit made with this
  # token starts no new workflow run.
  dependabot-title:
    name: shorten a Dependabot title
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # edit the title (Dependabot runs get read-only tokens unless granted)
    steps:
      - name: Shorten the title past the limit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # commitlint's header-max-length (commitlint.config.mjs).
          MAX_TITLE_CHARS: 72
        # Drops in turn, while the title is too long: the directory count, the group's name, the version
        # it updates from. A title that still does not fit stays, and the check reports it.
        run: |
          title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
          short=$title
          for pattern in 's/ across [0-9]+ director(y|ies)//' 's/ in the [^ ]+ group$//' 's/ from [^ ]+ to / to /'; do
            if [ "${#short}" -le "$MAX_TITLE_CHARS" ]; then break; fi
            short=$(printf '%s' "$short" | sed -E "$pattern")
          done
          if [ "$short" != "$title" ] && [ "${#short}" -le "$MAX_TITLE_CHARS" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -f title="$short" --jq .title
          fi

  title:
    name: title
    needs: dependabot-title
    # Also when the job above is skipped (not a Dependabot pull request) or failed (the check then
    # reports the long title itself).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the live pull request title
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Read live rather than from the event, so a rerun after fixing the title sees the new one.
      - name: Check the pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # A failed API call (a GitHub 502) gets two retries and then an error of its own, rather than an
        # empty title that commitlint reports as a bad one. The title goes through the commit-msg hook,
        # which runs commitlint and the rules commitlint lacks (characters, attribution lines).
        run: |
          for attempt in 1 2 3; do
            title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title) && break
            if [ "$attempt" = 3 ]; then echo "::error::could not read the pull request title"; exit 1; fi
            sleep 10
          done
          file="$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$title" > "$file"
          node scripts/git-hooks.ts commit-msg "$file"
