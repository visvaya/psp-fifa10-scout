name: Security

# Checks that look at the repository itself rather than at the app: the workflows (actionlint, zizmor)
# and the whole git history (gitleaks). The weekly run also catches advisories published against
# dependencies that have not changed.
#
# One job with one step per scanner: GitHub bills every job rounded up to a full minute and each scan
# takes seconds. Later steps run even when an earlier one fails, so every scanner reports.
#
# Pushes and pull requests run it from the CI workflow (its scan job), whose ci job is the required
# check; the weekly run starts it on its own.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A literal name: called from CI, github.workflow is the caller's, and its group would be the caller's.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks and actionlint run from images pinned by tag and digest in .github/gitleaks and
    # .github/actionlint, which Dependabot updates. zizmor is pinned by hand with a checksum: Dependabot does
    # not bump a tool installed in a run step, so scripts/check-pinned-tools.ts reports newer releases
    # (weekly, below).
    env:
      # Checksum of the manylinux x86_64 wheel on PyPI.
      ZIZMOR_VERSION: 1.32.0
      ZIZMOR_SHA256: 84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads every commit
          persist-credentials: false
      - name: Scan the full history for secrets
        run: |
          docker build --quiet --tag gitleaks .github/gitleaks
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo" gitleaks \
            git /repo --redact --no-banner --log-opts=--all
      # actionlint checks that the workflows are correct (expressions, action inputs, ShellCheck on the
      # run scripts); zizmor checks that they are safe.
      - name: Workflows pass actionlint
        if: ${{ !cancelled() }}
        run: |
          docker build --quiet --tag actionlint .github/actionlint
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo" --workdir /repo actionlint -color
      - name: Workflows pass the zizmor security audit
        if: ${{ !cancelled() }}
        env:
          # The online audits read the pinned actions through the GitHub API: impostor-commit (a pinned
          # commit that is not in the action's own repository), ref-confusion and known-vulnerable-actions.
          # The job's token can only read contents.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --only-binary :all: \
            --require-hashes -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --persona pedantic .github/workflows .github/dependabot.yml
      # The CI workflow audits production dependencies on every push and pull request; the scheduled
      # run repeats it for advisories published since, and reports newer releases of the tools above.
      # Only when this workflow runs on its own: called from CI, github.workflow is "CI".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ !cancelled() && github.workflow == 'Security' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && github.workflow == 'Security' }}
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          package-manager-cache: false
      - name: Audit production dependencies
        if: ${{ !cancelled() && github.workflow == 'Security' }}
        run: pnpm audit --prod
      - name: Hand-pinned tools are current
        if: ${{ !cancelled() && github.workflow == 'Security' }}
        run: node scripts/check-pinned-tools.ts
