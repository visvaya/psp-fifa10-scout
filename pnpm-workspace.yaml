# Supply-chain guards. Most malicious npm versions are pulled within days of publication,
# so a three-day delay keeps them out of the lockfile. Dependabot uses the same window
# (`cooldown` in .github/dependabot.yml).
minimumReleaseAge: 4320 # minutes, 3 days
# A critical security fix younger than that: add the package here with the advisory id,
# the date and the removal date, after checking the publisher. Remove it when the window passes.
minimumReleaseAgeExclude: []

# Refuse a version published with weaker provenance than an earlier one of the same package.
trustPolicy: no-downgrade

# pnpm 12 writes its own resolved version as a leading YAML document of pnpm-lock.yaml when
# packageManager pins it. GitHub's dependency graph reads only the first document, so it would
# see no dependencies and raise no alerts. "ignore" drops that document.
pmOnFail: ignore

# Development-only advisories pulled in by Stryker 10.1.1, fixed by the smallest version that clears them.
# Remove each entry once the pinned Stryker no longer depends on the vulnerable version (check at every
# Stryker update, and by 2027-02-01 at the latest).
# - typed-rest-client (used only by Stryker's dashboard reporter, not used here) pins qs 6.15.1:
#   GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, GHSA-6pq8-jhm2-2vcw, fixed in 6.16.1.
# - minimatch 10.2.6: GHSA-g3hv-75wg-m249, fixed in 11.0.1; 11.0.3 is the newest release older than the
#   three-day release-age window on 2026-11-03.
#
# Lighthouse (the advisory lab audit, scripts/measure-lighthouse.ts) reaches chromium-bidi through puppeteer-core.
# From puppeteer-core 25.13.0 on that is chromium-bidi 157.0.8090-0, published without the provenance its earlier
# releases carried, so trustPolicy refuses it. puppeteer-core 25.12.0 (within Lighthouse 13.5.0's ^25.9.0) still
# uses chromium-bidi 17.0.2, published with provenance. Check at every Lighthouse update and remove once a
# chromium-bidi release with provenance is in puppeteer-core's range.
overrides:
  "qs@6.15.1": 6.16.1
  "minimatch@10.2.6": 11.0.3
  "lighthouse>puppeteer-core": 25.12.0
